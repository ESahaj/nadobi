0;border:0;border-bottom:1px solid #adc0d1;background:transparent;text-align:left;color:var(--ink);text-decoration:none;font:inherit}.mode-copy{display:flex;flex-direction:column;gap:6px}.mode-copy strong{font-size:24px;font-weight:750;letter-spacing:-.04em}.mode-copy small{font-size:14px;color:var(--muted);font-weight:400}.arrow{display:grid;place-items:center;flex-shrink:0;width:42px;height:42px;border-radius:50%;border:1px solid #6792c4;color:var(--blue);font-size:24px;transition:transform .18s,background .18s}.test .arrow{color:var(--green);border-color:#7caa96}.mode-choice:hover .arrow{transform:translateX(4px);background:#dcecff}.mode-choice.test:hover .arrow{background:#e0f2e8}.mode-choice:hover strong{color:var(--blue)}.mode-choice.test:hover strong{color:var(--green)}.test-panel{max-width:530px;margin:40px auto 0;padding:30px 0 0;border-top:1px solid #ccd9e4;text-align:left}.test-panel h2{font-size:25px;letter-spacing:-.04em;margin:0 0 8px}.test-panel p{font-size:14px;color:var(--muted);line-height:1.5}.test-panel label{display:block;font-size:14px;font-weight:700;margin:20px 0 7px}.test-panel input{width:100%;padding:13px 15px;border:1px solid #a9bfce;border-radius:10px;background:#ffffffcf;color:var(--ink)}#code{font-weight:700;letter-spacing:.1em}.primary-btn{border:0;border-radius:10px;background:var(--ink);color:white;font-weight:700;padding:14px 20px;margin-top:22px}.primary-btn:hover{background:#285371}.primary-btn:disabled{opacity:.65;cursor:wait}.test-panel .status{color:#a32e49;min-height:22px}footer{text-align:center;margin-top:46px;color:#668093;font-size:12px;letter-spacing:.06em}@media(max-width:550px){.page{padding:48px 24px 32px}h1{font-size:clamp(42px,10.5vw,58px)}.mode-grid{gap:22px;margin-top:36px}.mode-copy strong{font-size:19px}.mode-copy small{font-size:12px}.arrow{width:32px;height:32px;font-size:20px}.mode-choice{gap:8px}.intro{font-size:15px}.lab-symbol{margin-bottom:24px}}@media(max-width:350px){.mode-grid{grid-template-columns:1fr;gap:12px}}@media(prefers-reduced-motion:reduce){.arrow{transition:none}}

body{background-image:linear-gradient(#f8fbffc0,#f8fbffc0),url('chemie.svg'),radial-gradient(ellipse at 8% 8%,#dcf5ef,transparent 60%),radial-gradient(ellipse at 95% 75%,#ece5ff,transparent 65%)}.page{position:relative;z-index:1}
h1 .first{color:#3464bf;background:linear-gradient(105deg,#216bc4 8%,#674cc5 55%,#ce4e83 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}h1 .highlight{color:#12846d;-webkit-text-stroke:.5px #12846d}h1 .highlight:before{background:linear-gradient(100deg,#afe1ff90,#b6efd990)}h1 .highlight:after{border-color:#278a91}
.author{margin:0 0 26px;color:#68788a;font-size:14px;font-weight:500;letter-spacing:.015em}
.background-art{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.background-art svg{position:absolute;overflow:visible;opacity:.75}
.flask{width:230px;height:340px;left:-20px;top:24%;transform:rotate(-15deg)}.tube{width:190px;height:280px;right:0;top:4%;transform:rotate(16deg)}.funnel{width:150px;height:250px;right:0;bottom:-18px;transform:rotate(-10deg)}.beaker{width:200px;height:220px;left:9%;bottom:-25px;transform:rotate(12deg)}

<h1 id="title"><span class="first">Chemické sklo</span><span class="highlight">a nádobí</span></h1>
<p class="intro">...aneb nálevka není trychtýř a plášť není kabát :)</p>
<div class="mode-grid"><a class="mode-choice" href="procvicovani.html"><span class="mode-copy"><strong>Procvičování</strong><small>Těžko na cvičišti...</small></span><span class="arrow" aria-hidden="true">↗</span></a><button class="mode-choice test" id="testMode" type="button" aria-expanded="false" aria-controls="testPanel"><span class="mode-copy"><strong>Test</strong><small>...lehko na bojišti!</small></span><span class="arrow" aria-hidden="true">→</span></button></div>
<section class="test-panel hidden" id="testPanel" aria-labelledby="testTitle"><h2 id="testTitle">Připraveno? Jdeme na test.</h2><p>Zadej své jméno a kód od učitele.</p><form id="testForm" method="post"><label for="studentName">Jméno a příjmení</label><input name="studentName" id="studentName" type="text" autocomplete="name" required minlength="3" maxlength="100" placeholder="Jana Nováková" aria-describedby="testStatus"><label for="code">Kód od učitele</label><input name="code" id="code" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" required minlength="6" maxlength="9" pattern="[0-9 ]{6,9}" placeholder="123456" aria-describedby="testStatus"><button class="primary-btn" type="submit" id="beginTest">Zahájit / pokračovat →</button></form><p id="testStatus" class="status" role="status"></p></section>
</section></main><script>
const TEST_URL='https://script.google.com/macros/s/AKfycbyqt0VtIgoO4pp8jev4MtGAhsqGBQX9vMUV-uSeDJqjpW7HnyIs8ONgCIXI0pwS5GWS/exec';
const panel=document.querySelector('#testPanel'),form=document.querySelector('#testForm'),input=document.querySelector('#code'),status=document.querySelector('#testStatus');form.action=TEST_URL;
document.querySelector('#testMode').addEventListener('click',()=>{panel.classList.remove('hidden');document.querySelector('#testMode').setAttribute('aria-expanded','true');document.querySelector('#studentName').focus();});
form.addEventListener('submit',event=>{const code=input.value.replace(/\s/g,''),name=document.querySelector('#studentName').value.normalize('NFC').trim().replace(/\s+/g,' ');if(!/^\p{L}[\p{L}\p{M} .’'\-]{2,99}$/u.test(name)||name.split(' ').filter(w=>/\p{L}/u.test(w)).length<2){event.preventDefault();status.textContent='Doplň své jméno a příjmení.';return;}if(!/^\d{6}$/.test(code)){event.preventDefault();status.textContent='Zadej šest číslic kódu.';return;}input.value=code;document.querySelector('#studentName').value=name;document.querySelector('#beginTest').disabled=true;status.textContent='Otevírám test…';});window.addEventListener('pageshow',()=>{document.querySelector('#beginTest').disabled=false;});
</script></body></html>
